name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # The packaging gates add three clean `npm install`s from tarballs.
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.4-alpine3.23@sha256:996d0920e4ff9df1fc19dacb904492f3c1ec0ec1cc338f0ad7123be7731c5f5e
        env:
          POSTGRES_PASSWORD: oaath-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres -t 1"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: v1.7.1
          cache: false
      - run: pnpm install --frozen-lockfile
      # Covers the root config files as well as every package.
      - run: pnpm typecheck
      - run: pnpm -r test
      - run: pnpm --filter @oaath/server test:postgres
        timeout-minutes: 2
        env:
          OAATH_POSTGRES_URL: postgresql://postgres@127.0.0.1:5432/postgres
          PGPASSWORD: oaath-ci-only
      - run: pnpm -r build
      - run: pnpm -r lint
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm --filter @oaath/sdk test:anvil
      # Packaging gates. Real gates, not advisory: each one fails the job. The
      # smokes pack the workspace and install the tarballs into a clean consumer,
      # so they prove the published artifacts rather than the workspace links.
      - run: pnpm check:public-surface
      - run: pnpm smoke:browser
      # The extension smoke is headful so Chrome runs its real MV3 worker and
      # IndexedDB implementation; Puppeteer then force-closes that worker.
      - run: xvfb-run --auto-servernum pnpm smoke:extension
        env:
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome
      - run: pnpm smoke:server
      # Its own step, so a two-chain materialization failure names itself instead
      # of hiding inside the single-chain anvil suites above.
      - run: pnpm smoke:all-chain
