name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - uses: dtolnay/rust-toolchain@70dec6087f2cb6bab9fbac4da23160afbe848e91 # 1.99.0
        with:
          components: clippy, rustfmt
      # Kernel address fixtures read the factory on a local loopback Anvil.
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: v1.7.1
          cache: false
      - run: bun install --frozen-lockfile
      # The TypeScript protocol owns the wire; committed fixtures must match it.
      - run: bun run fixtures:protocol
      # Intent-to-add also fails the job on a new, uncommitted fixture file.
      - run: git add --intent-to-add relay/fixtures && git diff --exit-code relay/fixtures
      - run: cargo fmt --check
        working-directory: relay
      - run: cargo clippy --workspace --all-targets -- -D warnings
        working-directory: relay
      - run: cargo test --workspace
        working-directory: relay
      # Login with OAAth end to end: the relay binary built above, the real
      # portal Worker module, the built SPA, and headless Chrome. Loopback only.
      - run: bun run --filter @oaath/portal test:e2e
        timeout-minutes: 5

  check:
    runs-on: ubuntu-latest
    # The packaging gates add three clean `npm install`s from tarballs.
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.4-alpine3.23@sha256:996d0920e4ff9df1fc19dacb904492f3c1ec0ec1cc338f0ad7123be7731c5f5e
        env:
          POSTGRES_PASSWORD: oaath-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres -t 1"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: v1.7.1
          cache: false
      - run: bun install --frozen-lockfile
      # Covers the root config files as well as every package.
      - run: bun run typecheck
      - run: bun run test
      - run: bun run --filter @oaath/server test:postgres
        timeout-minutes: 2
        env:
          OAATH_POSTGRES_URL: postgresql://postgres@127.0.0.1:5432/postgres
          PGPASSWORD: oaath-ci-only
      - run: bun run build
      - run: bun run --workspaces --if-present lint
      - run: bun run lint
      - run: bun run format:check
      - run: bun run --filter @oaath/sdk check:rate-limit-artifact
      - run: bun run --filter @oaath/contracts webauthn:check
      - run: bun run --filter @oaath/contracts weighted:check
      - run: bun run --filter @oaath/sdk test:anvil
      - run: bun run --filter @oaath/testing test:anvil
      # Packaging gates. Real gates, not advisory: each one fails the job. The
      # smokes pack the workspace and install the tarballs into a clean consumer,
      # so they prove the published artifacts rather than the workspace links.
      - run: bun run check:public-surface
      - run: bun run release:check
      - run: bun run smoke:protocol
      - run: bun run smoke:cetane
      - run: bun run smoke:kernel-import
      - run: bun run smoke:weighted-root
      - run: bun run smoke:passkey
        env:
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome
      - run: bun run smoke:pending-approval
        env:
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome
      - run: bun run smoke:browser
      # The extension smoke is headful so Chrome runs its real MV3 worker and
      # IndexedDB implementation; Puppeteer then force-closes that worker.
      - run: xvfb-run --auto-servernum bun run smoke:extension
        env:
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome
      - run: bun run smoke:session-signer
        timeout-minutes: 2
        env:
          OAATH_REQUIRE_POSTGRES: "1"
          OAATH_POSTGRES_URL: postgresql://postgres@127.0.0.1:5432/postgres
          PGPASSWORD: oaath-ci-only
      - run: bun run smoke:server
      # Its own step, so a two-chain materialization failure names itself instead
      # of hiding inside the single-chain anvil suites above.
      - run: bun run smoke:all-chain
