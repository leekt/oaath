packages:
  - "packages/*"
  # One private examples package. It publishes nothing and is never a dependency
  # of a published package; it exists so the runnable examples resolve the same
  # public `@oaath/*` entries an adopter installs.
  - "examples"
allowBuilds:
  # Runtime-bundles the private phone example's browser-only noble signer.
  esbuild: true
