[workspace]
resolver = "3"
members = ["crates/oaath-protocol"]

[workspace.package]
version = "0.3.4"
edition = "2024"
license = "Apache-2.0"
authors = ["taek <leekt216@gmail.com>"]
publish = false

[workspace.dependencies]
oaath-protocol = { path = "crates/oaath-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "arbitrary_precision"] }
thiserror = "2"
sha2 = "0.10"
base64 = "0.22"
rand = "0.9"
hex = "0.4"
alloy-primitives = "1"
alloy-sol-types = "1"
p256 = { version = "0.13", features = ["ecdsa"] }
k256 = { version = "0.13", features = ["ecdsa"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time"] }
axum = "0.8"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "json", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
