<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Wallet call status · OAAth</title>
    <link rel="stylesheet" href="theme.css" />
    <style>
      main {
        max-width: 720px;
        margin: 0 auto;
        padding: 40px 20px 48px;
      }
      .headline {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px;
        margin-bottom: 6px;
      }
      h1 {
        margin: 0;
        font-size: 22px;
        letter-spacing: -0.01em;
      }
      .badge {
        font-size: 12px;
      }
      #detail {
        margin: 0 0 20px;
        color: var(--muted);
        font-size: 14px;
        max-width: 62ch;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="headline">
        <h1>Wallet call status</h1>
        <span id="badge" class="badge" hidden></span>
      </div>
      <p id="detail">Reading the status…</p>
      <pre class="exact" id="status">reading…</pre>
    </main>
    <script type="module" src="status.js"></script>
  </body>
</html>
