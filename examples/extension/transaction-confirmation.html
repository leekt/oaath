<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Confirm wallet calls · OAAth</title>
    <link rel="stylesheet" href="theme.css" />
    <style>
      main {
        max-width: 720px;
        margin: 0 auto;
        padding: 40px 20px 48px;
      }
      h1 {
        margin: 0 0 6px;
        font-size: 22px;
        letter-spacing: -0.01em;
      }
      #summary {
        margin: 0 0 20px;
        color: var(--muted);
        font-size: 14px;
        max-width: 62ch;
      }
      #summary strong {
        color: var(--text);
      }
      h2 {
        margin: 24px 0 8px;
        font-size: 13px;
      }
      .decision {
        position: sticky;
        bottom: 0;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px;
        margin-top: 20px;
        padding: 14px 0;
        background: var(--bg);
        border-top: 1px solid var(--border);
      }
      .decision button {
        min-width: 120px;
        min-height: 40px;
        font-size: 14px;
      }
      #deadline {
        margin-left: auto;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }
      #result:empty {
        display: none;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Confirm wallet calls</h1>
      <p id="summary">Reading the request…</p>
      <h2 id="exact-heading">Exact request</h2>
      <pre class="exact" id="confirmation">reading…</pre>
      <p id="result" class="message" role="alert"></p>
      <div class="decision">
        <button type="button" id="reject" disabled>Reject</button>
        <button type="button" id="approve" class="primary" disabled>Approve and send</button>
        <span id="deadline" aria-live="off"></span>
      </div>
    </main>
    <script type="module" src="transaction-confirmation.js"></script>
  </body>
</html>
