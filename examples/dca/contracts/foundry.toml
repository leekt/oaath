[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["../../node_modules"]
# bun's isolated linker symlinks examples/node_modules into the repository's store.
allow_paths = ["../../../node_modules"]
remappings =["@openzeppelin/contracts/=../../node_modules/@openzeppelin/contracts/"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = true
evm_version = "paris"
bytecode_hash = "none"
cbor_metadata = false
